name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        env:
          # PyPI timeouts otherwise make pip backtrack to ancient sdists (e.g. matplotlib) that fail to build
          PIP_DEFAULT_TIMEOUT: '60'
          PIP_RETRIES: '10'
          PIP_ONLY_BINARY: matplotlib
        run: |
          python -m pip install --upgrade pip
          # PET (popt) and SimulatorWrap (subsurface) are not on PyPI. Pinned to the commits the code was
          # ported to (popt.optimization_methods / popt.ensembles API).
          python -m pip install "git+https://github.com/Python-Ensemble-Toolbox/PET.git@0a46451eca60d80ef50e96281274eedb623cf9f0"
          python -m pip install "git+https://github.com/Python-Ensemble-Toolbox/SimulatorWrap.git@0fc978cd1467d9fb2c931577baa9941dc6e8fb48"
          python -m pip install -e ".[analysis,dev]"

      - name: Run tests
        run: python -m pytest
