ensemble: 
  ne: 50
  transform: true
  num_models: 50
  state: [RATE_A1, RATE_A2, RATE_A3, RATE_A4, RATE_OP5, RATE_A5, RATE_A6]

  prior_RATE_A1:
    mean: '../init/rateA1.npz'
    var: 22500 # 5% of range
    limits: [0, 3000]

  prior_RATE_A2:
    mean: '../init/rateA2.npz'
    var: 40000 # 5% of range
    limits: [0, 4000]

  prior_RATE_A3:
    mean: '../init/rateA3.npz'
    var: 40000 # 5% of range
    limits: [0, 4000]

  prior_RATE_A4:
    mean: '../init/rateA4.npz'
    var: 40000 # 5% of range
    limits: [0, 4000]

  prior_RATE_OP5:
    mean: '../init/rateOP5.npz'
    var: 22500 # 5% of range
    limits: [0, 3000]
  
  prior_RATE_A5:
    mean: '../init/rateA5.npz'
    var: 160000 # 5% of range
    limits: [0, 8000]
  
  prior_RATE_A6:
    mean: '../init/rateA6.npz'
    var: 160000 # 5% of range
    limits: [0, 8000]


optim:
  maxiter: 20
  method: 'Newton-CG'
  step_size_adapt: 2
  obj_scaling: [187583, 2845473526]  # scaling for [NPV, Emissions]
  save_folder: ""

fwdsim:
  parallel: 10
  sim_limit: 24000
  runfile: DROGON
  windpower: '../init/wp_ens.npy'
  reporttype: dates
  datatype: [fopt, fgpt, fwpt, fwit, wthp a5, wthp a6]

  simoptions:
    mpi: mpirun -np 5
    sim_flag: --parsing-strictness=low

  reportpoint: 
    start: '2020-07-01' 
    end: '2025-01-01' 
    freq: MS
  
  npv_const:
    wop: 471.7  # approx 75 USD/bbl
    wgp: 0.4    # USD/Sm3
    wwp: 37     # USD/Sm3
    wwi: 25     # USD/Sm3
    wem: 150    # USD/ton
    disc: 0.08  # 8% per year



  
  
  
  
